<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%" height="24">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="35%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>
    <style>
      @keyframes pulseDot {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.4); opacity: 1; }
      }
      .center-flame {
        transform-origin: 500px 12px;
        animation: pulseDot 2s ease-in-out infinite;
      }
    </style>
  </defs>
  <line x1="100" y1="12" x2="475" y2="12" stroke="url(#dividerGrad)" stroke-width="1" />
  <g class="center-flame">
    <circle cx="500" cy="12" r="3" fill="#F59E0B" />
    <circle cx="500" cy="12" r="6" fill="#F59E0B" opacity="0.3" />
  </g>
  <polygon points="492,12 490,9 494,9" fill="#D4AF37" opacity="0.7" />
  <polygon points="508,12 506,9 510,9" fill="#D4AF37" opacity="0.7" />
  <line x1="525" y1="12" x2="900" y2="12" stroke="url(#dividerGrad)" stroke-width="1" />
</svg>
